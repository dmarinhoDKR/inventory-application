name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: partshelf_test
          POSTGRES_DB: partshelf_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U partshelf_test -d partshelf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          PARTSHELF_TEST_DB_PASSWORD: disposable-ci-password
